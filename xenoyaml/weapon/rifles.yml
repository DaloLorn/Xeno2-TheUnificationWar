$schemaVersion: 1.0.0
$aliases:
  SnapShot: &SnapShot
    $mode: snap
    $name: Snap Shot
    $percentCost: 24
    $accuracy: 38
    $crosshair: GC-::-ui/crosshairs/crosshair_snap
  NormalShot: &NormalShot
    $mode: normal
    $name: Normal Shot
    $percentCost: 36
    $accuracy: 72
    $crosshair: GC-::-ui/crosshairs/crosshair_normal
  AimedShot: &AimedShot
