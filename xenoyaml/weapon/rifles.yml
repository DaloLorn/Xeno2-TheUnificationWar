groundcombat:
  masters/item:
    ammo:
      parent: $next
      $path: ""
      components: 
        :InventorySlotAddPrerequisites: []

  item/ammo:
    ballistic_rifle:
      parent: GC%item/ammo/ballistic_rifle
      $path: ""
      components: 
        $Shots: 30

    ballistic_rifle_alloy:
      parent: GC%item/ammo/ballistic_rifle_alloy
      $path: ""
      components:
        $Weight: 3
        :DamageModifier:
          _min: 0
          _val: 1
          _max: 3.402823e+38
        :Modifiers:
          - $ModSoldierStat: # So that turned out to be a misnomer... oops.
              $stat: Xenonauts.GroundCombat.ArmourPenetration
              $amount: 2
    
    laser_rifle:
      parent: GC%item/ammo/laser_rifle
      $path: ""
      components:
        $Shots: 30
        :GCAbilityDefinitions:
          - :117:
              Regenerate: 3
              Name: Regenerate Ammo
              Tooltip: false

    laser_rifle_v2:
      parent: GC%item/ammo/laser_rifle_v2
      $path: ""
      components:
        $Shots: 45
        :GCAbilityDefinitions:
          - :117:
              Regenerate: 6
              Name: Regenerate Ammo
              Tooltip: false
    
    plasma_rifle_cell:
      parent: GC%item/ammo/plasma_rifle_cell
      $path: ""
      components:
        <<: *PlasmaCell
        :AmmoID: plasma
        $Shots: 15
        $ImpactVector:
          - $SpawnEnvironmentalEffect:
              $chance: 65
              $spawnStyles:
                - SpawnAsGas
              $effPath: blueprints/common/common/simple/effect/environmental/fire_spreading_1x1

    plasma_rifle_cell_v2:
      parent: GC%item/ammo/plasma_rifle_cell_v2
      $path: ""
      components:
        <<: *AdvPlasmaCell
        :AmmoID: plasma
        :GCAbilityDefinitions:
          - :117:
              Regenerate: 1
              Name: Regenerate Ammo
              Tooltip: false
    
    fusion_rifle_cell:
      parent: GC%item/ammo/plasma_rifle_cell
      $path: ""
      components:
        <<: *FusionCell
        :AmmoID: fusion
        :AmmoStandard: fusion_rifle
        :RecoveredItems:
          - $DropItem: item/ammo/fusion_rifle_cell

    fusion_rifle_cell_v2:
      parent: GC%item/ammo/plasma_rifle_cell_v2
      $path: ""
      components:
        <<: *AdvFusionCell
        :AmmoID: fusion
        :AmmoStandard: fusion_rifle
        :RecoveredItems:
          - $DropItem: item/ammo/fusion_rifle_cell_v2

    gauss_rifle_clip:
      parent: GC%item/ammo/gauss_rifle_clip
      $path: ""
      components:
        $Shots: 24

    gauss_rifle_clip_v2:
      parent: GC%item/ammo/gauss_rifle_clip_v2
      $path: ""
      components:
        :Modifiers:
          - $ModSoldierStat:
              $stat: Xenonauts.GroundCombat.ArmourDestruction
              $amount: 2
          - $ModSoldierStat:
              $stat: Xenonauts.GroundCombat.ArmourPenetration
              $amount: 5

    alien_mag_clip:
      parent: GC%item/ammo/alien_mag_clip
      $path: ""
      components:
        <<: *HeavyNeedlerClip
        $Shots: 50

    alien_plasma_cell:
      parent: GC%item/ammo/alien_plasma_cell
      $path: ""
      components:
        <<: *HeavyBlasterCell
        $Shots: 30
        $ImpactVector:
          - $SpawnEnvironmentalEffect:
              $chance: 65
              $spawnStyles:
                - SpawnAsGas
              $effPath: blueprints/common/common/simple/effect/environmental/fire_spreading_1x1

    alien_fusion_cell:
      parent: GC%item/ammo/alien_fusion_cell
      $path: ""
      components:
        <<: *FusionCasterCell
        $Shots: 15
        $ImpactVector:
          - $SpawnEnvironmentalEffect:
              $chance: 65
              $spawnStyles:
                - SpawnAsGas
              $effPath: blueprints/common/common/simple/effect/environmental/fire_spreading_1x1

  item/weapon:
    ballistic_rifle:
      parent: &BallRifle GC%item/weapon/ballistic_rifle
      $path: ""
      components:
        # No custom fire modes needed, ballistics are fine as-is.
        # Ditto for weight, reload cost, size, and ammo standard.
        $Damage: 30
        $ArmorDestruction: 2
        $ArmorPenetration: 10
        $BleedChance: 15
        $GCComplexEquipReqs:
          $cost:
            $OrPq:
              - $UnequippedReq: {}
              - $SlotOwnerPq:
                  $mode: All
                  $reqs:
                    - $NotColossus: {}
          $unlock:
            $SlotOwnerPq:
              $mode: Any
              $reqs: 
                - $TwoHandedReq: {}

    ballistic_rifle_v2:
      parent: &AccRifle GC%item/weapon/ballistic_rifle_v2
      $path: ""
      components:
        $Damage: 33
        $ArmorDestruction: 3
        $ArmorPenetration: 15

    ballistic_rifle_v3:
      parent: *AccRifle
      $path: ""
      components:
        <<: *AdvAccRifle
        $Damage: 36
        $ArmorDestruction: 4
        $ArmorPenetration: 20
        :RecoveredItems:
          - $DropItem: item/weapon/ballistic_rifle_v3

    ballistic_smg:
      parent: GC%item/weapon/ballistic_smg
      $path: ""
      components:
        $Damage: 30
        $ArmorPenetration: 5
        $ArmorDestruction: 1
        $BleedChance: 10
        $GCComplexEquipReqs:
          $cost:
            $OrPq:
              - $UnequippedReq: {}
              - $SlotOwnerPq:
                  $mode: All
                  $reqs:
                    - $NotColossus: {}
          $unlock:
            $SlotOwnerPq:
              $mode: Any
              $reqs: 
                - $TwoHandedReq: {}

    gauss_rifle:
      parent: GC%item/weapon/gauss_rifle
      $path: ""
      components:
        $Damage: 45
        $ArmorPenetration: 25
        $ArmorDestruction: 4

    gauss_rifle_v2:
      parent: GC%item/weapon/gauss_rifle_v2
      $path: ""
      components:
        $Damage: 48
        $ArmorPenetration: 30
        $ArmorDestruction: 6
        $SuppressionDamage: 38

    laser_rifle:
      parent: GC%item/weapon/laser_rifle
      $path: ""
      components:
        $Damage: 8
        $ArmorPenetration: 15
        $ArmorDestruction: 3
        $SuppressionDamage: 5
        :Description: >-
          Lasers are a unique kind of energy weapon. Like most energy weapons,
          they inflict more total damage, do not inflict Bleeding Wounds,
          and have reduced Armour Penetration, but have exceptional Armour Destruction
          for their size.

          
          Unlike other energy weapons, lasers fire 4 weaker beams for every shot
          fired by an equivalent non-laser weapon, and do not require research
          to regenerate ammunition. Additionally, they are not subject to recoil
          (except machineguns, which only have half recoil), and have increased accuracy
          as well as an accuracy bonus for low-accuracy soldiers.


          Lasers are not as prone to dissipation as most energy weapons. While they still
          have a much shorter optimal range than similar ballistic weapons, lasers suffer
          fairly limited accuracy/damage dropoff allowing them similar range to ballistics;
          this laser rifle only loses 5% per tile, compared to the 10% of a ballistic rifle.
        :GCAbilityDefinitions:
          - $ShotAbility:
              <<:
                - *SnapShot
                - *LaserShot
              $accuracy: 48
          - $ShotAbility:
              <<:
                - *NormalShot
                - *LaserShot
              $accuracy: 82
          - $ShotAbility:
              <<:
                - *AimedShot
                - *LaserShot
              $accuracy: 120
          - $ShotAbility:
              <<:
                - *BurstShot
                - *LaserShot
              $shots: 12
              $shotDelay: 0.0125
              $accuracy: 50
        $Recoil: 0
        $WeaponRange: 10
        $RangeBonus: 0.04
        $RangeDropoff: 0.05

    laser_rifle_v2:
      parent: GC%item/weapon/laser_rifle_v2
      $path: ""
      components:
        $Damage: 11
        $ArmorPenetration: 18
        $ArmorDestruction: 5

    plasma_rifle:
      parent: GC%item/weapon/plasma_rifle
      $path: ""
      components:
        <<: *PlasmaRifle
        $Damage: 50
        $ArmorPenetration: 15
        $ArmorDestruction: 20
        $BleedChance: 0
        $SuppressionDamage: 30
        :WeaponID: plasma
        $WeaponRange: 12
        $RangeBonus: 0.03
        $RangeDropoff: 0.125
        :Description: >-
          Plasma weapons are powerful, but short-ranged energy weapons.
          Like most energy weapons, they inflict more total damage, do not
          inflict Bleeding Wounds, and have reduced Armour Penetration,
          but have exceptional Armour Destruction for their size.


          Plasma weapons tend to destabilize quickly in atmosphere,
          resulting in very short optimal ranges and a more rapid
          accuracy/damage dropoff than ballistic weapons. However,
          they have somewhat improved ammo economy over lasers,
          and have a high chance of starting fires wherever they hit.


          This plasma rifle has a range dropoff of 12.5% (ballistics are 10%),
          and a 65% chance of setting a tile ablaze.
        
    plasma_rifle_v2:
      parent: GC%item/weapon/plasma_rifle_v2
      $path: ""
      components:
        $NoLocale: {}
        :Name: Fusion Rifle
        :CompatibleAmmo:
          - fusion_rifle
        $Damage: 60
        $ArmorDestruction: 25
        $BleedChance: 8
        $BleedRollMultiplier: 3
        $SuppressionDamage: 38
        :WeaponID: fusion
        :Description: >-
          Fusion weapons are a powerful variant of plasma weapons.
          Like most energy weapons, they inflict more total damage
          and have reduced Armour Penetration, with exceptional
          Armour Destruction for their size. However, they can
          also inflict a lot of Bleeding Wounds.


          Fusion weapons tend to destabilize quickly in atmosphere,
          resulting in very short optimal ranges and a more rapid
          accuracy/damage dropoff than ballistic weapons. However,
          they have somewhat improved ammo economy over lasers,
          and have a high chance of starting fires wherever they hit.


          This fusion rifle has a range dropoff of 12.5% (ballistics are 10%),
          and a 65% chance of setting a tile ablaze.

    electroshock_rifle:
      parent: GC%item/weapon/electroshock_rifle
      $path: ""
      components:
        $Damage: 20
        $StunDamage: 40
        $EMPDamage: 60
        $ArmorPenetration: 100
        $WeaponRange: 12
        $RangeBonus: 0.03
        $RangeDropoff: 0.125
        :Description: >-
          Electroshock weapons are a special kind of plasma weapon.
          Unlike most energy weapons, they have extremely high Armour Penetration
          and no Armour Destruction, and do not inflict a lot of direct damage.
          However, they inflict considerable amounts of Stun and EMP damage,
          making them useful for capturing living aliens or destroying mechanical units.


          Electroshock weapons tend to destabilize quickly in atmosphere,
          resulting in very short optimal ranges and a more rapid
          accuracy/damage dropoff than ballistic weapons. Additionally, they
          have considerably less ammo than plasma weapons, and cannot be upgraded
          further.


          This electroshock rifle has a range dropoff of 12.5% (ballistics are 10%).

    arc_caster:
      parent: GC%item/weapon/alien_servitor_cannon
      $path: ""
      components:
        <<: *ArcCaster
        $Damage: 2
        :DamageType: shock
        $StunDamage: 5
        $EMPDamage: 5
        $ArmorPenetration: 80
        :DisableReactionFire: true
        :CompatibleAmmo:
          - arc_caster
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsServitor: {}
        :Description: >-
          A powerful electroshock cannon piggybacking off the power supply
          for the Servitor's plasma cutter, mounted in the place of its
          nanite medspray. It functions like a hybridization of the
          plasma cutter and an electroshock rifle, firing a short-range
          barrage of projectiles inflicting heavy stunning damage to enemies
          in the vicinity.
        :InventorySlotType:
          - :CombatantSlots: Secondary
        :Portrait: GC-::-ui/item/weapon/electroshock_rifle.png

    xeno_magnetic_rifle:
      parent: *BallRifle
      $path: ""
      components:
        <<: *XenoHeavyNeedler
        $ArmorPenetration: 25
        $BleedChance: 12.5
        :GCAbilityDefinitions:
          - $ShotAbility:
              <<: *SnapShot
              $percentCost: 16
              $accuracy: 48
          - $ShotAbility:
              <<: *NormalShot
              $percentCost: 24
              $accuracy: 82
          - $ShotAbility:
              <<: *AimedShot
              $percentCost: 36
              $accuracy: 82
          - $ShotAbility:
              <<: *BurstShot
              $percentCost: 40
              $accuracy: 50
        $Recoil: 0.1
        $ReloadCost: 25
        :CompatibleAmmo:
          - alien_mag_clip
        :FireSounds:
          single:
            - GC-::-sfx/weapon/fire/fire_alien_magnetic_rifle.ogg
          burst:
            - GC-::-sfx/weapon/fire/fire_alien_magnetic_rifle.ogg
          empty:
            - GC-::-sfx/weapon/empty/empty_default.ogg
          reload:
            - GC-::-sfx/weapon/reload/reload_ballistic_default_1.ogg
          meleeHit: []
          meleeMiss: []
        :Portrait: GC-::-ui/item/weapon/alien_magnetic_rifle.png
        :Description: >-
          Needlers are a special kind of ballistic weapon. They inflict
          relatively low damage and Armour Destruction compared to
          accelerated weapons, but are more accurate, fire faster,
          and have increased Armour Penetration and ammo capacity.


          Needlers recovered on the battlefield are DNA-locked
          and cannot be used by human units. Xenonaut engineers
          can eventually defeat the DNA lock and create human-usable
          Needlers, but they cannot be upgraded further.
        :Prototype:
          value: GC-::-item/weapon/alien_magnetic_rifle.prefab
          addColliders: false
          dontInstantiate: true
          pool: false
        :RecoveredItems:
          - $DropItem: item/weapon/xeno_magnetic_rifle

    alien_magnetic_rifle:
      parent: &XenoRifle GC%item/weapon/xeno_magnetic_rifle
      $path: ""
      components:
        <<: *HeavyNeedler
        $GCComplexEquipReqs: &AlienRifleReqs
          $cost:
            $OrPq:
              - $UnequippedReq: {}
              - $SlotOwnerPq:
                  $mode: All
                  $reqs:
                    - $NotColossus: {}
          $unlock:
            $SlotOwnerPq:
              $mode: All
              $reqs: 
                - $TwoHandedReq: {}
                - $AlienUnit: {}
        :RecoveredItems:
          - $DropItem: item/weapon/alien_magnetic_rifle
          - $DropItem: item/alloys

    xeno_plasma_rifle:
      parent: *XenoRifle
      $path: ""
      components:
        <<: *XenoHeavyBlaster
        :CompatibleAmmo:
          - alien_plasmacell
        :FireSounds:
          single:
            - GC-::-sfx/weapon/fire/fire_plasma_rifle_single_0.ogg
            - GC-::-sfx/weapon/fire/fire_plasma_rifle_single_1.ogg
          burst:
            - GC-::-sfx/weapon/fire/fire_plasma_rifle_burst_0.ogg
            - GC-::-sfx/weapon/fire/fire_plasma_rifle_burst_1.ogg
          empty:
            - GC-::-sfx/weapon/empty/empty_default.ogg
          reload:
            - GC-::-sfx/weapon/reload/reload_plasma_rifle_1.ogg
          meleeHit: []
          meleeMiss: []
        :Portrait: GC-::-ui/item/weapon/alien_plasma_rifle.png
        :Prototype:
          value: GC-::-item/weapon/alien_plasma_rifle.prefab
          addColliders: false
          dontInstantiate: true
          pool: false
        :RecoveredItems:
          - $DropItem: item/weapon/xeno_plasma_rifle
        :Description: >-
          Blasters are a special kind of plasma weapon. They inflict
          relatively low damage and Armour Destruction compared to
          plasma weapons, but are more accurate, fire faster,
          and have increased Armour Penetration and ammo capacity.
          

          Blaster bolts are more compact than an equivalent plasma
          bolt, and have a shorter optimal range. However, they
          are not as heavily affected by range dropoff penalties,
          and therefore still have a higher maximum range.
          This heavy blaster has a dropoff rate of 5% per tile.


          Blasters recovered on the battlefield are DNA-locked
          and cannot be used by human units. Xenonaut engineers
          can eventually defeat the DNA lock and create human-usable
          Blasters, but they cannot be upgraded further.
        :WeaponID: plasma
        :DamageType: energy
        $Damage: 35
        $ArmorPenetration: 35
        $ArmorDestruction: 15
        $SuppressionDamage: 25
        $WeaponRange: 8
        $RangeBonus: 0.04
        $RangeDropoff: 0.05

    alien_plasma_rifle:
      parent: &XenoBlaster GC%item/weapon/xeno_plasma_rifle
      $path: ""
      components:
        <<: *HeavyBlaster
        $GCComplexEquipReqs: *AlienRifleReqs
        :RecoveredItems:
          - $DropItem: item/weapon/alien_plasma_rifle
          - $DropItem: item/alloys
          - $DropItem: item/alenium

    xeno_fusion_rifle:
      parent: *XenoBlaster
      $path: ""
      components:
        <<: *XenoFusionCaster
        :GCAbilityDefinitions:
          - $ShotAbility: 
              <<: *SnapShot
              $percentCost: 30
              $accuracy: 48
          - $ShotAbility: 
              <<: *NormalShot
              $percentCost: 40
              $accuracy: 82
          - $ShotAbility: 
              <<: *AimedShot
              $percentCost: 50
              $accuracy: 120
        :CompatibleAmmo:
          - alien_fusion_cell
        :WeaponID: fusion
        :Description: >-
          Fusion Casters are a special kind of fusion weapon. Unlike
          Blasters, they fire slowly and have limited ammo, but inflict
          the most damage of any rifle in the game. They also have
          further reduced range dropoff, increasing their maximum range.
          

          Alien fusion bolts are more compact than an equivalent fusion
          bolt, and have a shorter optimal range. However, they
          are not as heavily affected by range dropoff penalties,
          and therefore still have a higher maximum range.
          This fusion caster has a dropoff rate of 4% per tile.


          Fusion Casters recovered on the battlefield are DNA-locked
          and cannot be used by human units. Xenonaut engineers
          can eventually defeat the DNA lock and create human-usable
          Fusion Casters, but they cannot be upgraded further.
        $Damage: 85
        $ArmorPenetration: 20
        $ArmorDestruction: 25
        $RangeDropoff: 0.04
        $BleedChance: 10
        $BleedRollMultiplier: 3
        $SuppressionDamage: 42
        :RecoveredItems:
         - $DropItem: item/weapon/xeno_fusion_rifle
        :Portrait: GC-::-ui/item/weapon/alien_fusion_rifle.png
        :Prototype:
          value: GC-::-item/weapon/alien_fusion_rifle.prefab
          addColliders: false
          dontInstantiate: true
          pool: false
        
    alien_fusion_rifle:
      parent: GC%item/weapon/xeno_fusion_rifle
      $path: ""
      components:
        <<: *FusionCaster
        $GCComplexEquipReqs: *AlienRifleReqs
        :RecoveredItems:
          - $DropItem: item/weapon/alien_fusion_rifle
          - $DropItem: 
                $amount: 2
                $item: item/alloys
          - $DropItem:
                $amount: 2
                $item: item/alenium

