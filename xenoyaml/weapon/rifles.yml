    $name: Short Burst
    $shots: 3
    $shotDelay: 0.05
    $percentCost: 50
    $accuracy: 40
    $crosshair: GC-::-ui/crosshairs/crosshair_burst
  LaserShot: &LaserShot
    $trajectory: Line
    $shots: 4
    $shotDelay: 0.05

