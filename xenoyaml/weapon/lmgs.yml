    xeno_plasma_lmg:
      parent: *BlasterLmg
      $path: ""
      components: &XenoAutoBlaster
        $NoLocale: {}
        :Name: Auto-Blaster

    alien_fusion_lmg:
      parent: &FsnMinigun ST%item/weapon/alien_fusion_lmg
      $path: ""
