$schemaVersion: 1.0.0
$aliases:
  ShortBurst: &ShortBurst
    $mode: burst3
    $name: Short Burst
    $percentCost: 51
    $accuracy: 45
    $crosshair: GC-::-ui/crosshairs/crosshair_burst3.prefab
  LongBurst: &LongBurst
    $mode: burst10
    $name: Long Burst
    $shots: 3
    $shotDelay: 0.05
    $percentCost: 75
    $accuracy: 45
    $crosshair: GC-::-ui/crosshairs/crosshair_burst10.prefab
  ShortLaser: &ShortLaser
    $trajectory: Line
    $shots: 12
    $shotDelay: 0.025
    $accuracy: 55
  LongLaser: &LongLaser
    <<: *ShortLaser
    $shots: 40
    $shotDelay: 0.0125

strategy:
  item/ammo:
