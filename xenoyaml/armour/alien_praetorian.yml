$schemaVersion: 1.0.0

strategy:
  item/armour:
    andron_praetorian:
      parent:
        screen: ST
        path: item/armour/andron_praetorian
      $path: ""
      components: &AndronPraetorian
        $NoLocale: {}
        :Name: Praetorian Plating

    mantid_praetorian:
      parent:
        screen: ST
        path: item/armour/mantid_elite
      $path: ""
      components: &MantidPraetorian
        $NoLocale: {}
        :Name: Mantid Praetorian Armour

groundcombat:
  item/armour:
    psyon_praetorian:
      parent:
        screen: GC
        path: item/armour/psyon_praetorian
      $path: ""
      components:
        $HitPoints: 225
        $ArmorHardness: 30
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsPsyon: {}
        $PsyonRacials: {}

    secton_praetorian:
      parent:
        screen: GC
        path: item/armour/secton_praetorian
      $path: ""
      components:
        $HitPoints: 200
        $ArmorHardness: 30
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsSecton: {}
        $SectonRacials: {}

    sebillian_praetorian:
      parent:
        screen: GC
        path: item/armour/sebillian_praetorian
      $path: ""
      components:
        $HitPoints: 200
        $ArmorHardness: 30
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsSebillian: {}
        $SebillianRacials: 0

    mantid_praetorian:
      parent:
        screen: GC
        path: item/armour/mantid_elite
      $path: ""
      components:
        <<: *MantidPraetorian
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsMantid: {}
        $HitPoints: 130
        $ArmorHardness: 20
        $MantidRacials: {}

    wraith_praetorian:
      parent:
        screen: GC
        path: item/armour/wraith_praetorian
      $path: ""
      components:
        $HitPoints: 225
        $ArmorHardness: 30
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsWraith: {}
        $WraithRacials: 3

    andron_praetorian:
      parent:
        screen: GC
        path: item/armour/andron_praetorian
      $path: ""
      components:
        <<: *AndronPraetorian
        $HitPoints: 250
        $ArmorHardness: 30
        $GCEquipReqs:
          $SlotOwnerPq:
            $mode: All
            $reqs:
              - $IsAndron: {}
        $AndronRacials: 60
        $Weight: 0
        :Description: >-
          The sturdy outer frame of an Andron is covered in thick, disposable plates
          fashioned out of alien alloys. These can easily be replaced as new
          armor technology becomes available.

