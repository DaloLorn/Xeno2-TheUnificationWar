$schemaVersion: 1.0.0

strategy:
  loadout/combatant:
    psyon_defector:
      parent: &LoadoutBase GC-::-masters/loadout/combatant/humanoid_create
      name: psyon_defector
      $path: ""
      components:
        $EquippedItems:
          - $EquipArmor: ST-::-item/armour/psyon_noncom.json
          - $EquipPrimary: &BallRifle
              $item: ST-::-item/weapon/ballistic_rifle.json
              $ammo: ST-::-item/ammo/ballistic_rifle.json
              $strategy: "83"
          - $EquipSecondaryWithoutAmmo: ST-::-item/weapon/psi_amp_psyon.json
          - $EquipBelt: &Rifleman
            - $BeltItem:
                $item: ST-::-item/weapon/module_accuracy_tier1.json
                $strategy: "83"
            - $BeltItem:
                $item: ST-::-item/ammo/ballistic_rifle.json
                $strategy: "83"
                $x: 2
            - $BeltItem:
                $item: ST-::-item/weapon/grenade_frag.json
                $strategy: "83"
                $x: 3
            - $BeltItem:
                $item: ST-::-item/weapon/grenade_smoke.json
                $strategy: "83"
                $x: 4
            - $BeltItem:
                $item: ST-::-item/weapon/grenade_demolition.json
                $strategy: "83"
                $z: 2
          - $HasBackpack: {}

