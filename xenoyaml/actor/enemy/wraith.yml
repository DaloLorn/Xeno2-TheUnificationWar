      components:
        $NoncomStats: {}

    soldier/default:
      parent: $next
      $path: ""
      components:
        $SoldierStats: {}
        
    warrior/default:
      parent: $next
      $path: ""
      components:
        $WarriorStats: {}

    officer/default:
      parent: $next
      $path: ""
      components:
        $OfficerStats: {}
